<DirectoryMatch "^/var/www/html/(backend|database|tests|docs|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(?i)(^\.|^README\.md$|^Dockerfile$|\.(sql|ini|pem|key|crt|p12|pfx|dump|bak|orig)(\.gz)?$)">
    Require all denied
</FilesMatch>

<Directory "/var/www/html">
    Options -Indexes
</Directory>

RedirectMatch 403 "(?i)(?:^|/)\."
